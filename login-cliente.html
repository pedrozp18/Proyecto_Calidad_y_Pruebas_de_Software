<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine UPN - Portal Clientes</title>
    <link rel="stylesheet" href="css/login-cliente.css">
</head>
<body>

    <div class="login-card">
        <h2>Bienvenido Cinefilo</h2>
        <p>Accede a tus beneficios y membresía</p>

        <div id="alertError" class="alert alert-danger"></div>

        <form id="form-login-cliente">
            <div class="form-group">
    <label for="correo">Correo Electrónico</label>
    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
</div>

<div class="form-group">
    <label for="password">Contraseña</label>
    <input type="password" id="password" placeholder="••••••••" required>
</div>

    <!-- Cambia type="submit" por type="button" -->
<button type="button" id="btnLogin" class="btn-login">Iniciar Sesión</button>
    </form>
    <div style="text-align: center; margin-top: 1rem; font-size: 0.85rem; color: #94a3b8;">
    ¿No tienes cuenta? <a href="registro-cliente.html" style="color: #38bdf8; text-decoration: none;">Regístrate aquí</a>
    </div>
</div>
<script src="js/login-cliente.js"></script>
</body>
</html>
