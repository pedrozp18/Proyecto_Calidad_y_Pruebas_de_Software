<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cine UPN - Registro de Cliente</title>
    <link rel="stylesheet" href="css/registro-cliente.css">

</head>
<body>

    <div class="register-card">
        <h2>Crear Cuenta</h2>
        <p>Regístrate para reservar tus entradas online</p>

        <div id="alertMsg" class="alert"></div>

        <form id="formRegistroCliente">
          <!-- Nombres -->
          <div class="form-group">
                <label for="nombres">Nombres</label>
                <input type="text" id="nombres" name="nombres" placeholder="Ej. Juan Pedro" maxlength="100" required>
          </div>

          <!-- Apellido Paterno -->
          <div class="form-group">
                <label for="apellidoPaterno">Apellido Paterno</label>
                <input type="text" id="apellidoPaterno" name="apellidoPaterno" placeholder="Ej. Pérez" maxlength="100" required>
          </div>

          <!-- Apellido Materno -->
          <div class="form-group">
                <label for="apellidoMaterno">Apellido Materno</label>
                <input type="text" id="apellidoMaterno" name="apellidoMaterno" placeholder="Ej. Quispe" maxlength="100" required>
          </div>

            <div class="form-group">
                <label for="correo">Correo Electrónico</label>
                <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
            </div>

            <div class="form-group">
                <label for="dni">DNI / Documento</label>
                <input type="text" id="dni" maxlength="8" minlength="8" inputmode="numeric" placeholder="8 dígitos numéricos" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button type="submit" class="btn-register">Registrarse</button>
        </form>

        <div class="login-link">
            ¿Ya tienes una cuenta? <a href="login-cliente.html" id="linkLogin">Inicia sesión aquí</a>
        </div>
    </div>

    <script src="js/registro-cliente.js"></script>
</body>
</html>
