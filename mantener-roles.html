<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Gestión de Roles - CINEWEB PREMIUM</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <style>
        .roles-form-grid {
            display: grid;
            grid-template-columns: 1fr 2fr auto;
            gap: 12px;
            align-items: center;
        }
        .roles-form-grid input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid var(--border-color, #334155);
            background-color: var(--bg-deep, #0f172a);
            color: var(--text-white, #ffffff);
        }
        .tabla-roles-estilizada {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .tabla-roles-estilizada th,
        .tabla-roles-estilizada td {
            padding: 12px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border-color, #334155);
        }
        .tabla-roles-estilizada th {
            background-color: var(--bg-deep, #0f172a);
            color: #94a3b8;
            font-size: 0.85rem;
            text-transform: uppercase;
        }
        @media (max-width: 768px) {
            .roles-form-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <!-- Menú Lateral Administrador -->
    <div class="sidebar">
        <div class="sidebar-header">
            <i class="fa-solid fa-user-shield"></i>
            <h3>MÓDULO SUPERVISOR</h3>
            <span id="lbl-admin-nav">Administrador</span>
        </div>
        <ul class="sidebar-menu">
            <li><a href="consultar-movimientos.html"><i class="fa-solid fa-chart-line"></i> Consultar Movimientos</a></li>
            <li class="active"><a href="mantener-roles.html"><i class="fa-solid fa-user-gear"></i> Gestión de Roles</a></li>
            <li style="margin-top: 50px;"><a href="index.html" style="color: #f87171;"><i class="fa-solid fa-power-off"></i> Cerrar Sesión</a></li>
        </ul>
    </div>

    <!-- Área Principal -->
    <div class="main-content">
        <div class="content-header" style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Gestión de Roles de Sistema</h2>
        </div>

        <!-- Formulario para agregar roles -->
        <div class="card-panel">
            <div class="panel-title"><i class="fa-solid fa-plus-circle"></i> Registrar Nuevo Rol</div>
            <form id="form-rol" class="roles-form-grid">
                <input type="text" id="nombre_rol" placeholder="Nombre del Rol (ej. Cajero)" required>
                <input type="text" id="descripcion" placeholder="Descripción del rol" required>
                <button type="submit" class="btn btn-primary" style="padding: 10px 18px; cursor: pointer;">
                    <i class="fa-solid fa-floppy-disk"></i> Guardar Rol
                </button>
                <button type="button" id="btn-cancelar-edicion" class="btn btn-secondary" style="display:none; padding: 10px 14px; cursor: pointer;">
    Cancelar
</button>
            </form>
        </div>

        <!-- Tabla para listar roles existentes -->
        <div class="card-panel" style="margin-top: 25px;">
            <div class="panel-title"><i class="fa-solid fa-list"></i> Roles Registrados</div>
            <table class="tabla-roles-estilizada" id="tabla-roles">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Rol</th>
                        <th>Descripción</th>
                        <th>ACCIONES</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <script src="js/mantener-roles.js"></script>
</body>
</html>
